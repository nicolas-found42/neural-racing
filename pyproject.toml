[project]
name = "neural-racing"
version = "0.1.0"
description = "A car learns to drive a top-down oval track with a numpy policy and pygame rendering."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

[tool.ruff.lint]
# Ruff 0.16+ enables every stable rule by default, which flags style
# choices this game's rendering and training loops rely on. This keeps
# correctness and modernization checks only.
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM"]

# pygame's stubs type draw coordinates as Sequence[float] and numpy's as
# ArrayLike, so passing an ndarray row is reported even though pygame
# accepts it at runtime.
[[tool.ty.overrides]]
include = ["neural_racing/game.py", "neural_racing/network.py"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
